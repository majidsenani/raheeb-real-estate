<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع | رحيب المنازل للتطوير العقاري</title>
<meta name="description" content="تصفح المشاريع — فلل، شقق، أدوار.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="siteHeader"></div>

<!-- ============ المشاريع ============ -->
<section>
  <div class="wrap">
    <div class="section-head">
      <span class="kicker" data-i18n="props.kicker">المشاريع</span>
      <h2 id="pageTitle">المشاريع</h2>
    </div>

    <!-- شبكة المشاريع -->
    <div class="grid" id="propsGrid"></div>

    <!-- حالة "لا توجد نتائج" -->
    <div class="empty-state hide" id="emptyState">
      <h3 data-i18n="empty.title">لا توجد نتائج</h3>
    </div>
  </div>
</section>

<!-- ============ Footer ============ -->
<footer>
  <div class="wrap">
    <div class="footer-grid">
      <div><h4>رحيب المنازل</h4><p data-i18n="footer.about" style="max-width:34ch;">شركة رحيب المنازل للتطوير العقاري.</p></div>
      <div><h4 data-i18n="footer.links">روابط</h4><ul>
        <li><a href="index.html" data-i18n="nav.home">الرئيسية</a></li>
        <li><a href="index.html#projects" data-i18n="nav.projects">مشاريعنا</a></li>
        <li><a href="contact.html" data-i18n="nav.contact">تواصل معنا</a></li>
      </ul></div>
      <div><h4 data-i18n="footer.contact">تواصل</h4><ul>
        <li class="js-email">info@raheeb-almanazil.example</li>
        <li class="js-phone" dir="ltr" style="text-align:end;">+966 5X XXX XXXX</li>
      </ul></div>
    </div>
    <div class="footer-bottom">© 2026 رحيب المنازل للتطوير العقاري — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span></div>
  </div>
</footer>

<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>

<script>
  // ============ صفحة المشاريع (فلترة من الرابط فقط) ============
  document.addEventListener('DOMContentLoaded', async () => {
    const grid = document.getElementById('propsGrid');
    const emptyState = document.getElementById('emptyState');
    const pageTitle = document.getElementById('pageTitle');

    if(!grid) return;

    // جلب كل المشاريع
    const allProjects = await getProjects();

    // قراءة الفلتر من الرابط
    const params = new URLSearchParams(location.search);
    const currentType = params.get('type') || '';

    // العناوين حسب الفلتر
    const titles = {
      '': 'المشاريع',
      'villa': 'الفلل',
      'apartment': 'الشقق',
      'floor': 'الأدوار'
    };

    function draw(){
      const lang = getLang();
      let list = allProjects;
      if(currentType){
        list = list.filter(p => p.type === currentType);
      }

      pageTitle.textContent = titles[currentType] || 'المشاريع';

      if(list.length === 0){
        grid.innerHTML = '';
        emptyState.classList.remove('hide');
      } else {
        emptyState.classList.add('hide');
        grid.innerHTML = list.map(pr => projectCardHTML(pr, lang)).join('');
      }
    }

    draw();
    document.addEventListener('langchange', draw);
  });
</script>

</body>
</html>
