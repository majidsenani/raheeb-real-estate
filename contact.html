<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا | رحيب المنازل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <nav class="nav">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="رحيب المنازل للتطوير العقاري" class="brand-logo">
      <span class="name">رحيب المنازل<small data-i18n="brand.tagline">عقارات مختارة بعناية</small></span>
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">الرئيسية</a>
      <a href="properties.html" data-i18n="nav.properties">العقارات</a>
      <a href="index.html#about" data-i18n="nav.about">من نحن</a>
      <a href="contact.html" data-i18n="nav.contact">تواصل معنا</a>
      <a href="admin.html" data-i18n="nav.admin">لوحة التحكم</a>
      <button class="lang-btn" id="langBtn" data-i18n="lang.switch">English</button>
    </div>
    <button class="nav-toggle" aria-label="menu">☰</button>
  </nav>
</header>

<section>
  <div class="wrap">
    <div class="detail-grid">
      <div>
        <span class="kicker" data-i18n="contact.kicker">تواصل معنا</span>
        <h1 data-i18n="contact.title">أرسل لنا استفسارك</h1>
        <p data-i18n="contact.lead">سنرد عليك خلال يوم عمل واحد.</p>

        <form id="contactForm" class="form-grid mt-lg">
          <div class="field">
            <label data-i18n="contact.name">الاسم الكامل</label>
            <input type="text" name="name" required>
          </div>
          <div class="field">
            <label data-i18n="contact.phone">رقم الجوال</label>
            <input type="tel" name="phone" required>
          </div>
          <div class="field full">
            <label data-i18n="contact.email">البريد الإلكتروني</label>
            <input type="email" name="email" required>
          </div>
          <div class="field full">
            <label data-i18n="contact.msg">رسالتك</label>
            <textarea name="message" required></textarea>
          </div>
          <div class="field full">
            <button type="submit" class="btn" data-i18n="contact.send">إرسال الطلب</button>
            <p id="contactSent" class="admin-note hide" style="margin-top:16px;"></p>
          </div>
        </form>
      </div>

      <aside class="side-card">
        <h3 data-i18n="contact.info.title">معلومات التواصل</h3>
        <p class="js-email" style="margin-top:14px;">info@raheeb-almanazil.example</p>
        <p class="js-phone" dir="ltr" style="text-align:end;">+966 5X XXX XXXX</p>
        <p style="margin-top:14px; color:var(--ink-soft); font-size:.88rem;">
          الرياض · جدة · الدمام
        </p>
      </aside>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom">© 2026 رحيب المنازل — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span></div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>
</body>
</html>
