<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العقارات | رحيب المنازل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <nav class="nav">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="رحيب المنازل للتطوير العقاري" class="brand-logo">
      <span class="name">رحيب المنازل<small data-i18n="brand.tagline">عقارات مختارة بعناية</small></span>
    </a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.home">الرئيسية</a>
      <a href="properties.html" data-i18n="nav.properties">العقارات</a>
      <a href="index.html#about" data-i18n="nav.about">من نحن</a>
      <a href="contact.html" data-i18n="nav.contact">تواصل معنا</a>
      <a href="admin.html" data-i18n="nav.admin">لوحة التحكم</a>
      <button class="lang-btn" id="langBtn" data-i18n="lang.switch">English</button>
    </div>
    <button class="nav-toggle" aria-label="menu">☰</button>
  </nav>
</header>

<section>
  <div class="wrap">
    <div class="section-head">
      <h1 data-i18n="props.title">كل العقارات</h1>
      <p data-i18n="props.lead">استخدم الفلاتر لتضييق نتائج البحث.</p>
    </div>

    <div class="filters">
      <select id="fType">
        <option value="" data-i18n="filter.all">الكل</option>
        <option value="villa" data-i18n="filter.villa">فيلا</option>
        <option value="apartment" data-i18n="filter.apartment">شقة</option>
        <option value="land" data-i18n="filter.land">أرض</option>
      </select>
      <select id="fCity"></select>
      <input type="text" id="fSearch" data-i18n-ph="filter.search" placeholder="ابحث بالاسم...">
      <button id="fApply" data-i18n="filter.apply">تطبيق الفلتر</button>
    </div>

    <div class="grid" id="propsGrid"></div>
    <div class="empty-state hide" id="emptyState">
      <h3 data-i18n="empty.title">لا توجد عقارات مطابقة</h3>
      <p data-i18n="empty.lead">جرّب تعديل الفلاتر أو أعد تعيينها.</p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom">© 2026 رحيب المنازل — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span></div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>
<script>
  const urlType = new URLSearchParams(location.search).get('type');
  if(urlType){
    document.getElementById('fType').value = urlType;
    document.getElementById('fApply').click();
  }
</script>
</body>
</html>
