<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | رحيب المنازل للتطوير العقاري</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="siteHeader"></div>

<section>
  <div class="wrap">

    <!-- ================= بوابة الدخول ================= -->
    <div class="admin-gate" id="adminGate">
      <h1 data-i18n="admin.gate.title">دخول لوحة التحكم</h1>
      <p style="color:var(--ink-soft); margin-bottom:20px;" data-i18n="admin.gate.lead">هذه اللوحة تخزن البيانات في Supabase — تظهر لكل الزوار.</p>
      <div class="field">
        <label data-i18n="admin.gate.pass">كلمة المرور</label>
        <input type="password" id="adminPass">
      </div>
      <button class="btn" id="adminEnter" style="width:100%;" data-i18n="admin.gate.enter">دخول</button>
      <p id="adminWrong" class="hide" style="color:#B3402F; margin-top:10px; font-size:.88rem;" data-i18n="admin.gate.wrong">كلمة المرور غير صحيحة</p>
    </div>

    <!-- ================= لوحة التحكم ================= -->
    <div class="hide" id="adminPanel">

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <h1 style="margin:0;">لوحة التحكم</h1>
        <button id="adminLogout" class="btn ghost" data-i18n="admin.logout">خروج</button>
      </div>

      <!-- ========== قسم المشاريع ========== -->
      <section class="admin-block mt-lg">
        <h2 data-i18n="admin.project.title">إضافة مشروع جديد</h2>

        <form id="adminProjectForm" class="form-grid">
          <div class="field">
            <label data-i18n="admin.project.f.nameAr">اسم المشروع (عربي)</label>
            <input type="text" name="nameAr" required>
          </div>
          <div class="field">
            <label data-i18n="admin.project.f.nameEn">اسم المشروع (إنجليزي)</label>
            <input type="text" name="nameEn" required>
          </div>

          <div class="field">
            <label data-i18n="admin.project.f.type">النوع</label>
            <select name="type" required>
              <option value="villa">فيلا</option>
              <option value="apartment">شقة</option>
              <option value="floor">أدوار</option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="admin.project.f.floors">عدد الأدوار</label>
            <input type="number" name="floors" min="1" required>
          </div>

          <div class="field">
            <label data-i18n="admin.project.f.locationAr">الموقع (عربي)</label>
            <input type="text" name="locationAr" required>
          </div>
          <div class="field">
            <label data-i18n="admin.project.f.locationEn">الموقع (إنجليزي)</label>
            <input type="text" name="locationEn" required>
          </div>

          <div class="field">
            <label data-i18n="admin.project.f.stage">المرحلة</label>
            <select name="stage" required>
              <option value="sale">مرحلة البيع</option>
              <option value="finishing">مرحلة التشطيب</option>
              <option value="structure">مرحلة العظم</option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="admin.project.f.price">السعر (ريال)</label>
            <input type="number" name="price" min="0" value="0">
          </div>

          <div class="field">
            <label data-i18n="admin.project.f.area">المساحة (م²)</label>
            <input type="number" name="area" min="0" value="0">
          </div>
          <div class="field"></div>

          <!-- رفع صورة الغلاف -->
          <div class="field full">
            <label data-i18n="admin.project.f.cover">صورة الغلاف (من جهازك)</label>
            <input type="file" name="coverFile" accept="image/*" id="coverFileInput">
            <div id="coverPreview" class="upload-preview"></div>
          </div>

          <!-- رفع باقي الصور -->
          <div class="field full">
            <label data-i18n="admin.project.f.images">باقي الصور (يمكن اختيار عدة صور)</label>
            <input type="file" name="galleryFiles" accept="image/*" multiple id="galleryFilesInput">
            <div id="galleryPreview" class="upload-preview"></div>
          </div>

          <div class="field full">
            <label data-i18n="admin.project.f.descAr">وصف مختصر (عربي)</label>
            <textarea name="descAr" placeholder="اختياري"></textarea>
          </div>
          <div class="field full">
            <label data-i18n="admin.project.f.descEn">وصف مختصر (إنجليزي)</label>
            <textarea name="descEn" placeholder="اختياري"></textarea>
          </div>

          <div class="field full">
            <button type="submit" class="btn" data-i18n="admin.project.save">حفظ المشروع</button>
            <p id="adminProjectAdded" class="admin-note hide" style="margin-top:14px;" data-i18n="admin.project.added">تمت إضافة المشروع بنجاح.</p>
          </div>
        </form>

        <div class="admin-list">
          <h2 data-i18n="admin.project.list.title">المشاريع الحالية</h2>
          <div id="adminProjectList" class="mt-lg"></div>
        </div>
      </section>

    </div>

  </div>
</section>

<footer>
  <div class="wrap footer-bottom">© 2026 رحيب المنازل للتطوير العقاري — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span></div>
</footer>

<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/lang.js"></script>
<script src="js/main.js"></script>
<script src="js/effects.js"></script>

<script>
  // معاينة صورة الغلاف
  document.addEventListener('DOMContentLoaded', () => {
    const coverInput = document.getElementById('coverFileInput');
    const coverPreview = document.getElementById('coverPreview');
    if(coverInput && coverPreview){
      coverInput.addEventListener('change', () => {
        coverPreview.innerHTML = '';
        if(coverInput.files[0]){
          const img = document.createElement('img');
          img.src = URL.createObjectURL(coverInput.files[0]);
          coverPreview.appendChild(img);
        }
      });
    }

    // معاينة باقي الصور
    const galleryInput = document.getElementById('galleryFilesInput');
    const galleryPreview = document.getElementById('galleryPreview');
    if(galleryInput && galleryPreview){
      galleryInput.addEventListener('change', () => {
        galleryPreview.innerHTML = '';
        Array.from(galleryInput.files).forEach(file => {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          galleryPreview.appendChild(img);
        });
      });
    }
  });
</script>

</body>
</html>
